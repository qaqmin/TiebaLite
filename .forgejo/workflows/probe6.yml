name: Probe6
on:
  push:
    branches: [4.0-dev]
jobs:
  build:
    runs-on: codeberg-small
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: keytool genkeypair
        run: |
          keytool -genkeypair -v \
            -keystore app/tblite_debug.jks \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -dname "CN=TiebaLite" \
            -storepass tiebalite \
            -keypass tiebalite \
            -alias tiebalite
          ls -la app/tblite_debug.jks
      - name: Gradlew version
        run: ./gradlew --version 2>&1 | head -8 || echo "EXIT=$?"
