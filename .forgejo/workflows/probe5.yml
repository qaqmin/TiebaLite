name: Probe5
on:
  push:
    branches: [4.0-dev]
jobs:
  build:
    runs-on: codeberg-small
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Make keystore.properties
        run: |
          printf 'keystore.file=app/tblite_debug.jks\nkeystore.password=tiebalite\nkeystore.key.alias=tiebalite\nkeystore.key.password=tiebalite\n' > keystore.properties
          cat keystore.properties
      - name: Gradlew version
        run: sh ./gradlew --version 2>&1 | head -8 || echo "EXIT=$?"
