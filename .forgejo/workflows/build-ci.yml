name: Build, Deploy
run-name: Build, Deploy ${{ github.ref_name }}

on:
  push:
    branches: [master, 4.0-dev]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# 不写 permissions: Forgejo 不支持该字段 (Codeberg 每次 run 都告警并整段忽略),
# 见 docs.codeberg.org/ci — 发布步骤用 github.token (= forgejo.token) 即可

jobs:
  build:
    # Codeberg 托管 runner 仅 tiny(1C/2G/2min) / small(2C/4G/5min) / medium(4C/8G/10min)
    # 三档, 没有更大规格 (codeberg.org/actions/meta). -lazy 变体把时长放宽到约 24h, 但取任务
    # 延迟不可控 (actions/meta#76: 连 codeberg-medium 都出现过排队数小时); medium 的 10min
    # 只是 guideline 并非硬限制 (本项目 09-19 实测 2h 的 run 未被超时杀掉), 且本仓库历史 run
    # 在 medium 上均为秒级启动, 故用 medium.
    # 8G 额度把磁盘写入一并计入: "用 1G 内存且写了 1G 临时文件按 2G 配额计".
    # 另有一条 2 小时任务硬超时 (run #259/#260/#261/#267 均停在整 2h, #261/#267 的 Build 步骤
    # 分别 1h59m15s / 1h57m53s), 所以"构建够快"和"构建够轻"同样是被硬约束的:
    #   - 轻: 09-19/09-20 的 daemon disappeared 尸检死于 dex 合并阶段——彼时间接写入量最大
    #     的时刻, 页缓存+JVM 堆顶满 8G 触发宿主 OOM kill, 故本工作流一切步骤都以压缩
    #     总写入量为第一目标 (去掉 --info / 关 build cache / 关 Jetifier / 删安装包)
    #   - 快: 09-20 曾用 workers.max=1+parallel=false 压内存, 反而把构建拖到撞 2h 超时;
    #     run #251 证明并行配置下全流程仅 22 分钟, 故恢复并行, 内存安全靠上面的写入削减兜底
    runs-on: codeberg-medium
    concurrency:
      # 同一 ref 只保留最新一次 run: 修 CI 期间连续推送不会在共享队列里堆叠
      # (Codeberg 明确要求不要占队列), 被顶掉的旧 run 自动取消
      group: ${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        # runner 拉 actions/checkout 时 data.forgejo.org TLS 间歇被掐致整 job 秒挂 (09-19),
        # 改纯 git clone; Forgejo 无 GitHub marketplace, 本工作流不依赖任何 uses: action
        run: |
          ok=0
          for i in 1 2 3; do
            if git clone --depth 1 --branch "${{ github.ref_name }}" "https://codeberg.org/min09577/TiebaLite.git" .; then
              ok=1; break
            fi
            echo "clone failed (attempt $i), retrying..."
            rm -rf .git
            sleep 5
          done
          [ $ok -eq 1 ] || { echo "all clone attempts failed"; exit 1; }
          git log --oneline -1

      - name: Set up JDK 17
        # setup-java (node) 不走 HTTP_PROXY 且直连 azul 间歇被掐, 改国内镜像 curl 装载
        # 清华 Adoptium 17.0.20.1, 失败回落华为 openjdk 17.0.2 (单次下载中断 curl exit 18 的兜底)
        run: |
          JDK_URLS=(
            "https://mirrors.tuna.tsinghua.edu.cn/Adoptium/17/jdk/x64/linux/OpenJDK17U-jdk_x64_linux_hotspot_17.0.20.1_1.tar.gz"
            "https://mirrors.huaweicloud.com/openjdk/17.0.2/openjdk-17.0.2_linux-x64_bin.tar.gz"
          )
          ok=0
          for u in "${JDK_URLS[@]}"; do
            for i in 1 2 3; do
              if curl -sL --max-time 600 -o /tmp/jdk.tar.gz "$u" && tar tzf /tmp/jdk.tar.gz >/dev/null 2>&1; then
                ok=1; break 2
              fi
              echo "download failed ($u attempt $i), retrying..."
              sleep 5
            done
          done
          [ $ok -eq 1 ] || { echo "all JDK mirrors failed"; exit 1; }
          mkdir -p /opt/jdk && tar xzf /tmp/jdk.tar.gz -C /opt/jdk --strip-components=1
          # 安装包留着纯占写入额度, 解压完即删
          rm -f /tmp/jdk.tar.gz
          /opt/jdk/bin/java -version
          echo "JAVA_HOME=/opt/jdk" >> "$GITHUB_ENV"
          echo "/opt/jdk/bin" >> "$GITHUB_PATH"

      - name: Set up Android SDK
        # runner 镜像无 SDK: AGP 以 missingSdkDirectory 占位, javac 的 androidJdkImage
        # file dependency provider 无值 -> "Cannot query the value of this provider" (09-19 根因)
        # cmdline-tools 走 dl.google.com, 与 JDK 步骤同款重试; license 接受后 AGP 也可自愈补装
        run: |
          SDK=/opt/android-sdk
          command -v unzip >/dev/null 2>&1 || { apt-get update -qq && apt-get install -y -qq unzip; }
          CTL_URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          ok=0
          for i in 1 2 3; do
            if curl -sL --max-time 600 -o /tmp/ctl.zip "$CTL_URL" && unzip -tq /tmp/ctl.zip >/dev/null 2>&1; then
              ok=1; break
            fi
            echo "cmdline-tools download failed ($i), retrying..."
            sleep 5
          done
          [ $ok -eq 1 ] || { echo "all cmdline-tools downloads failed"; exit 1; }
          mkdir -p "$SDK/cmdline-tools"
          unzip -q /tmp/ctl.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          ok=0
          for i in 1 2 3; do
            if "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platforms;android-36" "build-tools;34.0.0" "platform-tools"; then
              ok=1; break
            fi
            echo "sdkmanager install failed ($i), retrying..."
            sleep 5
          done
          [ $ok -eq 1 ] || { echo "sdkmanager install failed"; exit 1; }
          ls "$SDK/platforms" "$SDK/build-tools"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          # 安装包与 apt 索引同样纯占额度, 一并清掉
          rm -f /tmp/ctl.zip
          rm -rf /var/lib/apt/lists/*

      - name: Generate keystore.properties
        run: |
          printf 'keystore.file=app/tblite_debug.jks\nkeystore.password=tiebalite\nkeystore.key.alias=tiebalite\nkeystore.key.password=tiebalite\n' > keystore.properties

      - name: Tune Gradle for Codeberg runner
        run: |
          sed -i 's|services.gradle.org/distributions|mirrors.cloud.tencent.com/gradle|' gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties
          # CI 侧内存/磁盘封顶. 追加同名键后者胜出 (Gradle 取最后一次定义), 本地构建不受影响.
          #   -Xmx4096m          daemon 堆恢复 4096m: 09-20 曾降到 3072m+单 worker, 结果构建被拖慢到
          #                      撞 2h 硬超时 (run #261/#267 均停在 1h58m 左右), 而 run #251 用
          #                      4096m+并行 22 分钟即全绿; dex 合并实际需要这个量级
          #   parallel=true     恢复并行 (workers 默认=CPU 数 4). 单模块项目下 workers.max=1 会把
          #                      AGP 的 Worker API 任务也串行化, 是拖慢的主因
          #   caching=false      CI 每次冷启动, build cache 命中率≈0, 写入是净开销 (且计入 8G 额度)
          #   in-process         Kotlin 编译改进程内执行, 免去 fork 第二个 JVM (宿主机无余量时
          #                      fork 直接 Not enough memory)
          #   Jetifier=false     全 AndroidX, 无 com.android.support 依赖 (本地 modules 缓存 0 命中),
          #                      Jetifier 会把每个 AAR 再变换复制一份, 磁盘 CPU 双浪费
          # 上面的磁盘侧削减 (无 --info / 无 build cache / 无 Jetifier / 单 variant / 删安装包)
          # 是 4096m 堆能活下来的前提: 09-20 run #265 正是带着 --info+jitpack 变换+build cache
          # 的页缓存顶满 8G 在 dex 阶段被宿主杀掉, run #267 削减后已能撑过该阶段.
          printf '\norg.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 --add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED\norg.gradle.parallel=true\norg.gradle.caching=false\nkotlin.compiler.execution.strategy=in-process\nandroid.enableJetifier=false\n' >> gradle.properties
          echo "=== gradle.properties 尾部 (确认覆盖生效) ==="
          tail -8 gradle.properties
          # 网络中断会留下半成品 accessor, 复用后报 "Generated class ... not found" (09-17 CI 根因之二)
          rm -rf .gradle/sweet-dependency/dependencies-accessors .gradle/sweet-property/properties-accessors
          # wrapper 解包后会保留 ~226MB 的发行版 zip (.ok 标记在, 删掉不会触发重下),
          # 先 --version 把它拉下来, 立刻删 zip
          ./gradlew --version >/dev/null 2>&1 || true
          find "${HOME:-/root}/.gradle/wrapper/dists" -maxdepth 3 -name '*.zip' -delete 2>/dev/null || true

      - name: Build APK
        # 分支/PR 只编 debug (无 R8, 最快最省); tag 只编 release (发布产物), 两者互斥 —
        # 09-20 的 tag run 在一个 job 里先后编 debug+release, 写入量直接翻倍顶满 8G 额度
        run: |
          case "${{ github.ref }}" in
            refs/tags/*) TASK=assembleRelease ;;
            *)           TASK=assembleDebug  ;;
          esac
          echo "=== $TASK (ref=${{ github.ref }}) ==="
          # 不用 --info: 它会把 build.log 写到数百 MB (计入磁盘额度) 且显著拖慢构建;
          # 下面 Dump 步骤所需的所有段在默认 lifecycle 日志 + --stacktrace 下都能取到
          e=1
          for i in 1 2 3; do
            ./gradlew "$TASK" --stacktrace --no-build-cache --console=plain > build.log 2>&1 && { e=0; break; }
            e=$?
            echo "$TASK attempt $i failed (rc=$e), retrying..."
            # 重试前杀 daemon: 失败的 daemon 可能带伤存活, 复用会再次崩
            ./gradlew --stop >/dev/null 2>&1 || true
            sleep 10
          done
          exit $e

      - name: Unit Tests
        # tag run 只保证发布产物可编出, 测试放到分支/PR 上跑 (省一次完整编译+测试的写入量)
        run: |
          case "${{ github.ref }}" in
            refs/tags/*) echo "tag build, skipping unit tests"; exit 0 ;;
          esac
          # 每步之间杀 daemon: 释放上一步累积的堆内存, 避免 test 在高水位 daemon 里再被 OOM
          ./gradlew --stop >/dev/null 2>&1 || true
          for i in 1 2 3; do
            ./gradlew testDebugUnitTest --no-build-cache --console=plain && break
            [ "$i" -eq 3 ] && exit 1
            echo "testDebugUnitTest attempt $i failed, retrying..."
            ./gradlew --stop >/dev/null 2>&1 || true
            sleep 10
          done

      - name: Dump build diagnostics
        # 任何前面步骤失败即执行; build.log 在同一 job 的步骤间保留
        if: failure()
        run: |
          [ -f build.log ] || { echo "(no build.log — 失败发生在构建之前)"; exit 0; }
          {
            echo "===== build.log 行数 ====="
            grep -c "" build.log || true
            echo "===== What went wrong 后 60 行 ====="
            grep -q "What went wrong" build.log && awk '/What went wrong/{found=1} found{print; n++} n>60{exit}' build.log || echo "not found"
            echo "===== daemon 死亡迹象 (OOM/被杀) ====="
            grep -aE "daemon disappeared|Not enough memory|Killed|OutOfMemoryError|GC overhead limit" build.log | head -20 || echo "not found"
            echo "===== TaskDependencyResolveException 段 ====="
            grep -q "TaskDependencyResolveException" build.log && awk '/TaskDependencyResolveException/{found=1} found{print; n++} n>50{exit}' build.log || echo "not found"
            echo "===== inner Caused by 段 (MissingValue 前后) ====="
            grep -q "Caused by: org.gradle.api.internal.provider.MissingValueException" build.log && awk '/Caused by: org.gradle.api.internal.provider.MissingValueException/{found=1} found{print; n++} n>60{exit}' build.log || echo "not found"
            echo "===== javac 编译错误行 ====="
            grep -aE "\.java:[0-9]+: error" build.log | head -40 || echo "not found"
            grep -a "error: " build.log | head -20 || true
            echo "===== 最后 12 个已执行任务 (定位 daemon 死亡点) ====="
            grep -a "> Task" build.log | tail -12 || echo "not found"
            echo "===== FAILED 任务 ====="
            grep -aE "> Task .* FAILED|FAILURE:" build.log | head -20 || echo "not found"
          } | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: Build Release APK
        # 兼容保留: release 已并入上面的 Build APK 步骤 (tag 时编 release)
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "release APK 已在 Build APK 步骤中编出"

      - name: Collect APKs
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p apks
          cp app/build/outputs/apk/debug/*.apk apks/ 2>/dev/null || true
          cp app/build/outputs/apk/release/*.apk apks/ 2>/dev/null || true
          ls -la apks/

      # 自动发布 APK 到 Codeberg Release（仅 tag 触发时）
      # 旧版用 gh + github.token 打 github.com 是 GitHub 遗产, 在 Forgejo 上必然 401 且 gh 缺失 (09-19 改原生 API)
      - name: Publish to Codeberg Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          API="https://codeberg.org/api/v1/repos/min09577/TiebaLite"
          AUTH="Authorization: token $TOKEN"
          # 从 AI_CHANGELOG.md 提取该 tag 的中文段落 (文件/段落缺失则用默认文案)
          NOTES=""
          if [ -f AI_CHANGELOG.md ]; then
            NOTES=$(awk -v tag="$TAG" '
              index($0, "## " tag " ") == 1 || $0 == "## " tag {found=1; next}
              found && index($0, "## ") == 1 {exit}
              found {print}
            ' AI_CHANGELOG.md)
            CN=$(printf '%s\n' "$NOTES" | awk 'index($0,"### ")==1 && /中文/{found=1; next} index($0,"### ")==1 {found=0} found')
            [ -z "$CN" ] && CN="$NOTES"
          fi
          [ -n "$CN" ] || CN="TiebaLite $TAG 自动构建发布。"
          PRERELEASE=true
          case "$TAG" in *-ai*) ;; *) PRERELEASE=false ;; esac
          esc() { printf '%s' "$1" | sed 's/\\/\\\\/g; s/"/\\"/g' | awk '{printf "%s\\n", $0}'; }
          BODY="{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"prerelease\":$PRERELEASE,\"draft\":false,\"body\":\"$(esc "$CN")\"}"
          # 同名 release 已存在则先删 (tag 保留, 与旧 gh delete+create 行为一致)
          RID=$(curl -sL --max-time 60 -H "$AUTH" "$API/releases/tags/$TAG" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)
          if [ -n "$RID" ]; then
            echo "release $RID already exists for $TAG, deleting..."
            curl -sL --max-time 60 -X DELETE -H "$AUTH" "$API/releases/$RID"
          fi
          ok=0
          for i in 1 2 3; do
            RESP=$(curl -sL --max-time 60 -H "$AUTH" -H "Content-Type: application/json" -d "$BODY" "$API/releases")
            RID=$(printf '%s' "$RESP" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)
            [ -n "$RID" ] && { ok=1; break; }
            echo "create release failed (attempt $i): $(printf '%s' "$RESP" | head -c 200)"
            sleep 5
          done
          [ $ok -eq 1 ] || { echo "release create failed"; exit 1; }
          echo "release id=$RID"
          for f in app/build/outputs/apk/release/*.apk app/build/outputs/apk/debug/*.apk; do
            # 只编了 release 时 debug glob 不会展开, 原样传字面量给 curl 会失败, 需跳过
            [ -f "$f" ] || continue
            NAME=$(basename "$f")
            up_ok=0
            for i in 1 2 3; do
              if curl -sL --max-time 600 -H "$AUTH" -F "attachment=@$f" "$API/releases/$RID/assets?name=$NAME" | grep -q '"id"'; then
                up_ok=1; break
              fi
              echo "upload $NAME failed (attempt $i), retrying..."
              sleep 5
            done
            [ $up_ok -eq 1 ] || { echo "upload $NAME failed"; exit 1; }
          done
          echo "Done! $API/releases/tag/$TAG"
