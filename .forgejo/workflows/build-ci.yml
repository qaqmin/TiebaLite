name: Build, Deploy
run-name: Build, Deploy ${{ github.ref_name }}

on:
  push:
    branches: [master, 4.0-dev]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: codeberg-medium
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        # setup-java (node) 不走 HTTP_PROXY 且直连 azul 间歇被掐, 改国内镜像 curl 装载
        run: |
          curl -sL --retry 3 --max-time 600 -o /tmp/jdk.tar.gz https://mirrors.huaweicloud.com/openjdk/17.0.2/openjdk-17.0.2_linux-x64_bin.tar.gz
          mkdir -p /opt/jdk && tar xzf /tmp/jdk.tar.gz -C /opt/jdk --strip-components=1
          /opt/jdk/bin/java -version
          echo "JAVA_HOME=/opt/jdk" >> "$GITHUB_ENV"
          echo "/opt/jdk/bin" >> "$GITHUB_PATH"

      - name: Generate keystore.properties
        run: |
          printf 'keystore.file=app/tblite_debug.jks\nkeystore.password=tiebalite\nkeystore.key.alias=tiebalite\nkeystore.key.password=tiebalite\n' > keystore.properties

      - name: Verify keystore.properties
        run: ls -la keystore.properties && cat keystore.properties

      - name: Build Debug APK
        run: |
          sed -i 's|services.gradle.org/distributions|mirrors.cloud.tencent.com/gradle|' gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties
          # 本地 runner (Fake-IP 环境) 需走宿主机代理拉 Maven 依赖; 云端 runner 探测不到代理自动跳过
          # 写进仓库 gradle.properties (gradle 必读, 不依赖 GRADLE_USER_HOME/挂载)
          if curl -s --max-time 3 -o /dev/null -x http://host.docker.internal:6789 https://repo.maven.apache.org/maven2/; then
            printf '\nsystemProp.http.proxyHost=host.docker.internal\nsystemProp.http.proxyPort=6789\nsystemProp.https.proxyHost=host.docker.internal\nsystemProp.https.proxyPort=6789\nsystemProp.http.nonProxyHosts=localhost|127.*|host.docker.internal|mirrors.cloud.tencent.com|mirrors.huaweicloud.com|maven.aliyun.com\n' >> gradle.properties
            grep -c systemProp gradle.properties
            echo "gradle proxy enabled (local runner detected)"
          else
            echo "no local proxy, using direct connection"
          fi
          ./gradlew assembleDebug --stacktrace --console=plain 2>&1 | tee build.log | tail -60
          e=${PIPESTATUS[0]}
          if [ $e -ne 0 ]; then
            echo "===== FAILURE ROOT CAUSE ====="
            grep -m5 -B2 -A8 "Caused by" build.log || grep -m3 -B3 -A10 "What went wrong" build.log || echo "no marker found"
            echo "===== END ====="
          fi
          exit $e

      - name: Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p apks
          cp app/build/outputs/apk/debug/*.apk apks/ 2>/dev/null || true
          cp app/build/outputs/apk/release/*.apk apks/ 2>/dev/null || true
          ls -la apks/

      # 自动发布 APK 到 GitHub Release（仅 tag 触发时）
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          echo "Deleting old release if exists..."
          gh release delete "$TAG" --yes 2>/dev/null || true
          echo "Creating release $TAG..."
          CN_NOTES="$(python3 -c "import re; text=open('AI_CHANGELOG.md',encoding='utf-8').read(); m=re.search(r'^## '+re.escape('$TAG')+r'[^\n]*\n(.*?)(?=^## )',text,re.S|re.M); sec=m.group(1) if m else ''; m2=re.search(r'### 🇨🇳 中文\n(.*?)(?=^### |\Z)',sec,re.S|re.M); print(m2.group(1).strip() if m2 else '')" || true)"
          DESC="## $TAG

          ${CN_NOTES}

          ---
          | APK | 适用场景 |
          |------|------|
          | release | 正式使用（已混淆优化，约 10MB） |
          | debug | 测试调试（保留完整日志） |
          "
          gh release create "$TAG" --title "$TAG" --notes "$DESC"
          echo "Uploading APKs..."
          gh release upload "$TAG" \
            app/build/outputs/apk/release/*.apk \
            --clobber
          echo "Done!"

# runner: codeberg-medium (8G RAM, 10min) # v5
