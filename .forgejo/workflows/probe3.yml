name: Probe3
on:
  push:
    branches: [4.0-dev]
jobs:
  build:
    runs-on: codeberg-small
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inspect gradlew
        run: |
          ls -la gradlew
          head -c 40 gradlew | od -c | head -3
          sh gradlew --version 2>&1 | head -8 || echo "EXIT=$?"
