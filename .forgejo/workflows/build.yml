name: Build, Deploy
run-name: Build, Deploy ${{ github.ref_name }}

on:
  push:
    branches: [master, 4.0-dev]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: codeberg-medium
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "zulu"
          cache: gradle

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p apks
          cp app/build/outputs/apk/debug/*.apk apks/ 2>/dev/null || true
          cp app/build/outputs/apk/release/*.apk apks/ 2>/dev/null || true
          ls -la apks/

      # 自动发布 APK 到 GitHub Release（仅 tag 触发时）
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          echo "Deleting old release if exists..."
          gh release delete "$TAG" --yes 2>/dev/null || true
          echo "Creating release $TAG..."
          CN_NOTES="$(python3 -c "import re; text=open('AI_CHANGELOG.md',encoding='utf-8').read(); m=re.search(r'^## '+re.escape('$TAG')+r'[^\n]*\n(.*?)(?=^## )',text,re.S|re.M); sec=m.group(1) if m else ''; m2=re.search(r'### 🇨🇳 中文\n(.*?)(?=^### |\Z)',sec,re.S|re.M); print(m2.group(1).strip() if m2 else '')" || true)"
          DESC="## $TAG

          ${CN_NOTES}

          ---
          | APK | 适用场景 |
          |------|------|
          | release | 正式使用（已混淆优化，约 10MB） |
          | debug | 测试调试（保留完整日志） |
          "
          gh release create "$TAG" --title "$TAG" --notes "$DESC"
          echo "Uploading APKs..."
          gh release upload "$TAG" \
            app/build/outputs/apk/release/*.apk \
            --clobber
          echo "Done!"

# runner: codeberg-medium (8G RAM, 10min)
