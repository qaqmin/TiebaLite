name: GradleTest
run-name: GradleTest ${{ github.ref_name }}
on:
  push:
    branches: [4.0-dev]
jobs:
  t:
    runs-on: codeberg-small
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: true
      - name: Gradle version
        run: gradle --version || echo "no gradle cli"
