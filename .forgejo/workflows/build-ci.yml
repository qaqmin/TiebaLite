name: Build, Deploy
run-name: Build, Deploy ${{ github.ref_name }}

on:
  push:
    branches: [master, 4.0-dev]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: codeberg-medium
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        # setup-java (node) 不走 HTTP_PROXY 且直连 azul 间歇被掐, 改国内镜像 curl 装载
        # 清华 Adoptium 17.0.20.1, 失败回落华为 openjdk 17.0.2 (单次下载中断 curl exit 18 的兜底)
        run: |
          JDK_URLS=(
            "https://mirrors.tuna.tsinghua.edu.cn/Adoptium/17/jdk/x64/linux/OpenJDK17U-jdk_x64_linux_hotspot_17.0.20.1_1.tar.gz"
            "https://mirrors.huaweicloud.com/openjdk/17.0.2/openjdk-17.0.2_linux-x64_bin.tar.gz"
          )
          ok=0
          for u in "${JDK_URLS[@]}"; do
            for i in 1 2 3; do
              if curl -sL --max-time 600 -o /tmp/jdk.tar.gz "$u" && tar tzf /tmp/jdk.tar.gz >/dev/null 2>&1; then
                ok=1; break 2
              fi
              echo "download failed ($u attempt $i), retrying..."
              sleep 5
            done
          done
          [ $ok -eq 1 ] || { echo "all JDK mirrors failed"; exit 1; }
          mkdir -p /opt/jdk && tar xzf /tmp/jdk.tar.gz -C /opt/jdk --strip-components=1
          /opt/jdk/bin/java -version
          echo "JAVA_HOME=/opt/jdk" >> "$GITHUB_ENV"
          echo "/opt/jdk/bin" >> "$GITHUB_PATH"

      - name: Generate keystore.properties
        run: |
          printf 'keystore.file=app/tblite_debug.jks\nkeystore.password=tiebalite\nkeystore.key.alias=tiebalite\nkeystore.key.password=tiebalite\n' > keystore.properties

      - name: Verify keystore.properties
        run: ls -la keystore.properties && cat keystore.properties

      - name: Build Debug APK
        run: |
          sed -i 's|services.gradle.org/distributions|mirrors.cloud.tencent.com/gradle|' gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties
          # 网络中断会留下半成品 accessor, 复用后报 "Generated class ... not found" (09-17 CI 根因之二)
          rm -rf .gradle/sweet-dependency/dependencies-accessors .gradle/sweet-property/properties-accessors
          # 二分定位: help(纯配置) / dry-run(任务图) / 各子任务
          ./gradlew help --console=plain > help.log 2>&1 || echo "help failed"
          for t in :app:compileDebugJavaWithJavac; do
            rc=0
            ./gradlew $t --dry-run --console=plain > dry.log 2>&1 || rc=$?
            echo "=== $t rc=$rc ==="
            grep -i "What went wrong" -A4 dry.log | head -8 || true
            grep -i "Caused by" dry.log | head -3 || true
          done
          echo "=== 再试 -PnoComposeArgs (跳过 compose compiler 参数) ==="
          rc=0
          ./gradlew :app:compileDebugJavaWithJavac --dry-run -PnoComposeArgs --console=plain > dry2.log 2>&1 || rc=$?
          echo "=== javac+noComposeArgs rc=$rc ==="
          grep -i "What went wrong" -A4 dry2.log | head -8 || true
          ./gradlew assembleDebug --stacktrace --info --console=plain > build.log 2>&1 || e=$?
          e=${e:-0}
          {
            echo "===== GRADLE EXIT: $e ====="
            echo "===== javac 完整异常链 (TaskDependencyResolveException 段) ====="
            grep -q "TaskDependencyResolveException" build.log && awk '/TaskDependencyResolveException/{found=1} found{print; n++} n>50{exit}' build.log || echo "not found"
            echo "===== What went wrong 后 60 行 ====="
            grep -q "What went wrong" build.log && awk '/What went wrong/{found=1} found{print; n++} n>60{exit}' build.log || echo "not found"
            echo "===== inner Caused by 段 (MissingValue 前后) ====="
            grep -q "Caused by: org.gradle.api.internal.provider.MissingValueException" build.log && awk '/Caused by: org.gradle.api.internal.provider.MissingValueException/{found=1} found{print; n++} n>60{exit}' build.log || echo "not found"
          } | tee -a "$GITHUB_STEP_SUMMARY" || true
          # build.log 全文存为 artifact, 以便排查 inner stack
          mkdir -p diag && cp build.log diag/ 2>/dev/null || true
          exit $e

      - name: Upload build.log
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: build-log
          path: diag/build.log
          if-no-files-found: ignore

      - name: Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p apks
          cp app/build/outputs/apk/debug/*.apk apks/ 2>/dev/null || true
          cp app/build/outputs/apk/release/*.apk apks/ 2>/dev/null || true
          ls -la apks/

      # 自动发布 APK 到 GitHub Release（仅 tag 触发时）
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          echo "Deleting old release if exists..."
          gh release delete "$TAG" --yes 2>/dev/null || true
          echo "Creating release $TAG..."
          CN_NOTES="$(python3 -c "import re; text=open('AI_CHANGELOG.md',encoding='utf-8').read(); m=re.search(r'^## '+re.escape('$TAG')+r'[^\n]*\n(.*?)(?=^## )',text,re.S|re.M); sec=m.group(1) if m else ''; m2=re.search(r'### 🇨🇳 中文\n(.*?)(?=^### |\Z)',sec,re.S|re.M); print(m2.group(1).strip() if m2 else '')" || true)"
          DESC="## $TAG

          ${CN_NOTES}

          ---
          | APK | 适用场景 |
          |------|------|
          | release | 正式使用（已混淆优化，约 10MB） |
          | debug | 测试调试（保留完整日志） |
          "
          gh release create "$TAG" --title "$TAG" --notes "$DESC"
          echo "Uploading APKs..."
          gh release upload "$TAG" \
            app/build/outputs/apk/release/*.apk \
            --clobber
          echo "Done!"

# runner: codeberg-medium (8G RAM, 10min) # v5
