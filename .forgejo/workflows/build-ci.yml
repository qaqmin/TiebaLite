name: Build, Deploy
run-name: Build, Deploy ${{ github.ref_name }}

on:
  push:
    branches: [master, 4.0-dev]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: codeberg-medium
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE != '' }}

    steps:
      - name: Checkout
        # runner 拉 actions/checkout 时 data.forgejo.org TLS 间歇被掐致整 job 秒挂 (09-19),
        # 改纯 git clone, 工作流不再依赖任何 uses: action
        run: |
          ok=0
          for i in 1 2 3; do
            if git clone --depth 1 --branch "${{ github.ref_name }}" "https://codeberg.org/min09577/TiebaLite.git" .; then
              ok=1; break
            fi
            echo "clone failed (attempt $i), retrying..."
            rm -rf .git
            sleep 5
          done
          [ $ok -eq 1 ] || { echo "all clone attempts failed"; exit 1; }
          git log --oneline -1

      - name: Set up JDK 17
        # setup-java (node) 不走 HTTP_PROXY 且直连 azul 间歇被掐, 改国内镜像 curl 装载
        # 清华 Adoptium 17.0.20.1, 失败回落华为 openjdk 17.0.2 (单次下载中断 curl exit 18 的兜底)
        run: |
          JDK_URLS=(
            "https://mirrors.tuna.tsinghua.edu.cn/Adoptium/17/jdk/x64/linux/OpenJDK17U-jdk_x64_linux_hotspot_17.0.20.1_1.tar.gz"
            "https://mirrors.huaweicloud.com/openjdk/17.0.2/openjdk-17.0.2_linux-x64_bin.tar.gz"
          )
          ok=0
          for u in "${JDK_URLS[@]}"; do
            for i in 1 2 3; do
              if curl -sL --max-time 600 -o /tmp/jdk.tar.gz "$u" && tar tzf /tmp/jdk.tar.gz >/dev/null 2>&1; then
                ok=1; break 2
              fi
              echo "download failed ($u attempt $i), retrying..."
              sleep 5
            done
          done
          [ $ok -eq 1 ] || { echo "all JDK mirrors failed"; exit 1; }
          mkdir -p /opt/jdk && tar xzf /tmp/jdk.tar.gz -C /opt/jdk --strip-components=1
          /opt/jdk/bin/java -version
          echo "JAVA_HOME=/opt/jdk" >> "$GITHUB_ENV"
          echo "/opt/jdk/bin" >> "$GITHUB_PATH"

      - name: SDK Diagnostics
        run: |
          echo "===== SDK 诊断 =====" | tee -a "$GITHUB_STEP_SUMMARY" || true
          env | grep -i android | tee -a "$GITHUB_STEP_SUMMARY" || echo "(env 无 ANDROID*)" | tee -a "$GITHUB_STEP_SUMMARY"
          for d in "$ANDROID_HOME" "$ANDROID_SDK_ROOT" /opt/android-sdk /usr/lib/android-sdk /root/Android/Sdk /usr/local/lib/android/sdk /home/runner/Android/Sdk; do
            if [ -n "$d" ] && [ -d "$d" ]; then
              echo "--- SDK dir: $d" | tee -a "$GITHUB_STEP_SUMMARY"
              echo "  top: $(ls "$d" 2>/dev/null | tr '\n' ' ' | head -c 300)" | tee -a "$GITHUB_STEP_SUMMARY"
              echo "  platforms: $(ls "$d/platforms" 2>/dev/null | tr '\n' ' ')" | tee -a "$GITHUB_STEP_SUMMARY"
              echo "  build-tools: $(ls "$d/build-tools" 2>/dev/null | tr '\n' ' ')" | tee -a "$GITHUB_STEP_SUMMARY"
              echo "  licenses: $(ls "$d/licenses" 2>/dev/null | tr '\n' ' ')" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          done
          which sdkmanager adb aapt2 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: Set up Android SDK
        # runner 镜像无 SDK: AGP 以 missingSdkDirectory 占位, javac 的 androidJdkImage
        # file dependency provider 无值 -> "Cannot query the value of this provider" (09-19 根因)
        # cmdline-tools 走 dl.google.com, 与 JDK 步骤同款重试; license 接受后 AGP 也可自愈补装
        run: |
          SDK=/opt/android-sdk
          command -v unzip >/dev/null 2>&1 || { apt-get update -qq && apt-get install -y -qq unzip; }
          CTL_URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          ok=0
          for i in 1 2 3; do
            if curl -sL --max-time 600 -o /tmp/ctl.zip "$CTL_URL" && unzip -tq /tmp/ctl.zip >/dev/null 2>&1; then
              ok=1; break
            fi
            echo "cmdline-tools download failed ($i), retrying..."
            sleep 5
          done
          [ $ok -eq 1 ] || { echo "all cmdline-tools downloads failed"; exit 1; }
          mkdir -p "$SDK/cmdline-tools"
          unzip -q /tmp/ctl.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          ok=0
          for i in 1 2 3; do
            if "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platforms;android-36" "build-tools;34.0.0" "platform-tools"; then
              ok=1; break
            fi
            echo "sdkmanager install failed ($i), retrying..."
            sleep 5
          done
          [ $ok -eq 1 ] || { echo "sdkmanager install failed"; exit 1; }
          ls "$SDK/platforms" "$SDK/build-tools"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Generate keystore.properties
        run: |
          printf 'keystore.file=app/tblite_debug.jks\nkeystore.password=tiebalite\nkeystore.key.alias=tiebalite\nkeystore.key.password=tiebalite\n' > keystore.properties

      - name: Verify keystore.properties
        run: ls -la keystore.properties && cat keystore.properties

      - name: Build Debug APK
        run: |
          sed -i 's|services.gradle.org/distributions|mirrors.cloud.tencent.com/gradle|' gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties
          # 网络中断会留下半成品 accessor, 复用后报 "Generated class ... not found" (09-17 CI 根因之二)
          rm -rf .gradle/sweet-dependency/dependencies-accessors .gradle/sweet-property/properties-accessors
          # jitpack.io TLS 握手间歇被掐 (09-19 checkDebugAarMetadata XXPermissions), gradle 级重试
          e=1
          for i in 1 2 3; do
            ./gradlew assembleDebug --stacktrace --info --console=plain > build.log 2>&1 && { e=0; break; }
            e=$?
            echo "assembleDebug attempt $i failed (rc=$e), retrying..."
            sleep 10
          done
          {
            echo "===== GRADLE EXIT: $e ====="
            echo "===== javac 完整异常链 (TaskDependencyResolveException 段) ====="
            grep -q "TaskDependencyResolveException" build.log && awk '/TaskDependencyResolveException/{found=1} found{print; n++} n>50{exit}' build.log || echo "not found"
            echo "===== What went wrong 后 60 行 ====="
            grep -q "What went wrong" build.log && awk '/What went wrong/{found=1} found{print; n++} n>60{exit}' build.log || echo "not found"
            echo "===== inner Caused by 段 (MissingValue 前后) ====="
            grep -q "Caused by: org.gradle.api.internal.provider.MissingValueException" build.log && awk '/Caused by: org.gradle.api.internal.provider.MissingValueException/{found=1} found{print; n++} n>60{exit}' build.log || echo "not found"
            echo "===== javac 编译错误行 ====="
            grep -aE "\.java:[0-9]+: error" build.log | head -40 || echo "not found"
            grep -a "error: " build.log | head -20 || true
          } | tee -a "$GITHUB_STEP_SUMMARY" || true
          # build.log 全文 base64 打进 summary (runner 拉 upload-artifact action 时 TLS 间歇被掐,
          # 整个 job 直接失败, 故改纯 shell: 截取关键段已足够, 另存 base64 备查)
          echo '```' >> "$GITHUB_STEP_SUMMARY" || true
          grep -c "" build.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo '```' >> "$GITHUB_STEP_SUMMARY" || true
          exit $e

      - name: Unit Tests
        run: |
          for i in 1 2 3; do
            ./gradlew testDebugUnitTest --console=plain && break
            [ "$i" -eq 3 ] && exit 1
            echo "testDebugUnitTest attempt $i failed, retrying..."
            sleep 10
          done

      - name: Build Release APK
        run: |
          for i in 1 2 3; do
            ./gradlew assembleRelease --console=plain && break
            [ "$i" -eq 3 ] && exit 1
            echo "assembleRelease attempt $i failed, retrying..."
            sleep 10
          done

      - name: Collect APKs
        run: |
          mkdir -p apks
          cp app/build/outputs/apk/debug/*.apk apks/ 2>/dev/null || true
          cp app/build/outputs/apk/release/*.apk apks/ 2>/dev/null || true
          ls -la apks/

      # 自动发布 APK 到 GitHub Release（仅 tag 触发时）
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          echo "Deleting old release if exists..."
          gh release delete "$TAG" --yes 2>/dev/null || true
          echo "Creating release $TAG..."
          CN_NOTES="$(python3 -c "import re; text=open('AI_CHANGELOG.md',encoding='utf-8').read(); m=re.search(r'^## '+re.escape('$TAG')+r'[^\n]*\n(.*?)(?=^## )',text,re.S|re.M); sec=m.group(1) if m else ''; m2=re.search(r'### 🇨🇳 中文\n(.*?)(?=^### |\Z)',sec,re.S|re.M); print(m2.group(1).strip() if m2 else '')" || true)"
          DESC="## $TAG

          ${CN_NOTES}

          ---
          | APK | 适用场景 |
          |------|------|
          | release | 正式使用（已混淆优化，约 10MB） |
          | debug | 测试调试（保留完整日志） |
          "
          gh release create "$TAG" --title "$TAG" --notes "$DESC"
          echo "Uploading APKs..."
          gh release upload "$TAG" \
            app/build/outputs/apk/release/*.apk \
            --clobber
          echo "Done!"

# runner: codeberg-medium (8G RAM, 10min) # v5
